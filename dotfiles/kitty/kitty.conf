# vim:ft=kitty
#
# Installed to ~/.config/kitty/ by dev_tools `provision`, which re-copies it on
# every run: edit the copy in the repo. Colors are not set here; they come from
# current-theme.conf, which `kitten themes` owns.
#
# Reload a running kitty with ctrl+shift+f5. Every option and its default:
# https://sw.kovidgoyal.net/kitty/conf/

# --- Font -------------------------------------------------------------------
font_family      family="0xProto Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# --- Cursor -----------------------------------------------------------------
# Animate a trail behind cursor jumps; the value is how long (ms) the cursor
# must have rested before a move draws one, which keeps typing trail-free.
cursor_trail       3
cursor_trail_decay 0.1 0.3

# --- Scrollback -------------------------------------------------------------
scrollback_lines              10000
# MB kept beyond scrollback_lines, reachable only through the pager
# (ctrl+shift+h), so a long build log survives without costing interactive
# scrolling anything.
scrollback_pager_history_size 64
scrollbar                     scrolled

# --- Window -----------------------------------------------------------------
window_padding_width    4
remember_window_size    yes
enable_audio_bell       no
# Dim the text of unfocused splits so the focused one is obvious; negative
# means only when more than one kitty window is visible.
inactive_text_alpha     -0.7

# Only cells painted with the theme's own background color become
# translucent, so a program that draws a different background stays opaque.
# No background_blur: mutter does not implement the blur protocol.
background_opacity         0.96
# Lets ctrl+shift+a>m / ctrl+shift+a>l change opacity in a running window.
dynamic_background_opacity yes

# --- Tab bar ----------------------------------------------------------------
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"

# --- Layouts ----------------------------------------------------------------
# splits first makes it the startup layout; ctrl+shift+l cycles the rest.
enabled_layouts splits,tall,fat,grid,stack

# --- Shell integration ------------------------------------------------------
# Needs shell integration, which kitty injects into bash by itself.
notify_on_cmd_finish unfocused 30

# --- Mappings ---------------------------------------------------------------
# kitty_mod is ctrl+shift. Defaults worth knowing, none remapped here:
#   kitty_mod+enter  new window        kitty_mod+t      new tab
#   kitty_mod+e      open a URL        kitty_mod+p>f    insert a path on screen
#   kitty_mod+z / x  jump to previous / next prompt
#   kitty_mod+f3     command palette   kitty_mod+f2     edit this file

# New windows and tabs start in the focused window's directory.
map kitty_mod+enter launch --cwd=current
map kitty_mod+t     launch --cwd=current --type=tab

# Scrollback pagers fed with logical lines. The built-in show_scrollback
# breaks the text at every screen-edge wrap, so a search for a word that
# straddles a wrap finds nothing. nvim gets plain text in an ordinary buffer:
# a cursor that n/N move between matches, v/y to copy, q to quit. less keeps
# the colors but can only scroll to a match, so it is the read-only view.
map kitty_mod+h launch --type=overlay --stdin-source=@screen_scrollback nvim -R -n -c 'setlocal buftype=nofile bufhidden=wipe nonumber norelativenumber signcolumn=no wrap' -c 'nnoremap <buffer> q <cmd>qa!<cr>' -c 'normal! G' -
map kitty_mod+g launch --type=overlay --stdin-source=@last_cmd_output nvim -R -n -c 'setlocal buftype=nofile bufhidden=wipe nonumber norelativenumber signcolumn=no wrap' -c 'nnoremap <buffer> q <cmd>qa!<cr>' -
map kitty_mod+/ launch --type=overlay --stdin-source=@screen_scrollback --stdin-add-formatting less --RAW-CONTROL-CHARS +G

# TODO: split and focus mappings for the splits layout. The actions are:
#   launch --location=hsplit --cwd=current    (new window below)
#   launch --location=vsplit --cwd=current    (new window beside)
#   neighboring_window left|right|up|down
#   move_window left|right|up|down
#   layout_action rotate

# --- Theme ------------------------------------------------------------------
# Keep this block in exactly this form: `kitten themes` looks for it and
# rewrites current-theme.conf. It also comments out every color-valued option
# it finds in this file, so those live in theme-overrides.conf instead.
# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME
include theme-overrides.conf
