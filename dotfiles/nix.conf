# ~/.config/nix/nix.conf -- installed by dev_tools/provision (dotfiles/nix.conf).
# Settings reference: https://nix.dev/manual/nix/2.35/command-ref/conf-file.html
# The invoking user is in trusted-users (provision appends it to
# /etc/nix/nix.conf), so the daemon honors these client-side settings.

# no-url-literals was removed from Nix and is no longer a valid feature name.
# pipe-operators: RFC 148 |> / <| in the Nix language.
# cgroups: enables use-cgroups below.
extra-experimental-features = nix-command flakes pipe-operators cgroups

# Run builds in their own cgroup: accurate resource accounting and reliable
# teardown of everything a build spawned.
use-cgroups = true

# --- Build parallelism ---
max-jobs = 4
cores = 18

# --- Store hygiene ---
auto-optimise-store = true
# GC keeps build-time deps and .drvs of live outputs, so dev shells don't
# get rebuilt from scratch after every nix-collect-garbage.
keep-outputs = true
keep-derivations = true
# Auto-GC: kick in below 5 GiB free, stop once 25 GiB have been freed.
min-free = 5368709120
max-free = 26843545600

# --- Network / substitution ---
http-connections = 50
max-substitution-jobs = 32
# Fail fast to local building when offline instead of hanging on cache.nixos.org.
connect-timeout = 5
# A cache miss (or flaky cache) falls back to building from source.
fallback = true
# 128 MiB download buffer; silences "download buffer is full" stalls on fast links.
download-buffer-size = 134217728
# Remote builders (if ever configured) fetch their own substitutes.
builders-use-substitutes = true

# --- UX ---
# Keep building independent derivations after one fails.
keep-going = true
log-lines = 50
# Flake evals of a dirty git tree are routine on a dev box; don't nag.
warn-dirty = false
bash-prompt-prefix = "<Nix> "

# --- Opt-ins left disabled on purpose ---
# XDG layout (~/.local/state/nix instead of ~/.nix-profile): enable only after
# migrating existing profiles, or installed packages vanish from PATH.
# use-xdg-base-directories = true
# Honor nixConfig from arbitrary flakes without prompting (security tradeoff).
# accept-flake-config = true
